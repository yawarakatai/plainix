[package]
name = "plainix-cli"
version = "0.4.0"
edition = "2024"
description = "Scaffold reproducible project environments with Nix"
license = "MIT"
repository = "https://github.com/yawarakatai/plainix"

[[bin]]
name = "plainix"
path = "src/main.rs"

[dependencies]
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }
